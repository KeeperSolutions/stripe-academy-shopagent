[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shopagent"
version = "0.1.0"
description = "Conversational shopping assistant (Agentic Commerce Training)"
requires-python = ">=3.11"
# Runtime dependencies are pinned in requirements.txt, which stays the single
# source of truth for this training project.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Three kinds of test now live side by side, and the difference is what each
# one needs to run:
#   (unmarked)  nothing outside the process — the D1/D2 rule, still the default
#   db          the local Postgres from `docker compose up -d`
#   network     the OpenAI API, which costs money on every run
#
# `network` is deselected by default so `pytest tests/` stays free and works
# offline. Run those deliberately: `pytest tests/ -m network`.
markers = [
    "db: needs the local Postgres (docker compose up -d)",
    "network: calls the OpenAI API and spends tokens",
]
addopts = "-m 'not network'"
