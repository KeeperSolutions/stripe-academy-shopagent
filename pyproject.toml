[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shopagent"
version = "0.1.0"
description = "Conversational shopping assistant (Agentic Commerce Training)"
requires-python = ">=3.11"
# Runtime dependencies are pinned in requirements.txt, which stays the single
# source of truth for this training project.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Four kinds of test now live side by side, and the difference is what each
# one needs to run:
#   (unmarked)  nothing outside the process — the D1/D2 rule, still the default
#   db          the local Postgres from `docker compose up -d`
#   network     the OpenAI API, which costs money on every run
#   stripe      the Stripe API in test mode — no money, but a real account
#
# `network` and `stripe` are both deselected by default so `pytest tests/`
# stays free and works offline. Run them deliberately: `pytest tests/ -m
# network`, `pytest tests/ -m stripe`.
#
# `stripe` is separate from `network` rather than folded into it because they
# fail for different reasons and are fixed differently: `network` needs an
# OpenAI key and spends tokens, `stripe` needs a Stripe test key and spends
# nothing. Merging them would mean a developer with one key and not the other
# could run neither.
markers = [
    "db: needs the local Postgres (docker compose up -d)",
    "network: calls the OpenAI API and spends tokens",
    "stripe: calls the Stripe API in test mode (needs STRIPE_SECRET_KEY)",
]
addopts = "-m 'not network and not stripe'"
# The repository root on `sys.path`, so `tests` is importable as a package.
# One test needs that — `test_the_handler_takes_no_body_parameter` imports
# `walk_api_routes` from `tests.test_api_auth` rather than keeping a second
# copy of the route walker — and without this line it fails with
# `ModuleNotFoundError: No module named 'tests'`.
#
# The defect it fixes is not that test's: `python -m pytest` puts the working
# directory on `sys.path` and bare `pytest` does not, so the suite passed for
# whoever happened to type the first form and failed for whoever typed the
# second — which is the command the README gives. A repository that works on
# one machine and not another, the same class as the unpinned `langfuse`
# D10 recorded, and invisible until somebody else clones it.
pythonpath = ["."]
